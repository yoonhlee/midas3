<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>직무 탐색 — JOBSIM</title>
<link rel="stylesheet" href="/common/site.css">
<style>
.search-bar{display:grid;grid-template-columns:1fr 220px auto;gap:8px;align-items:center;margin-bottom:12px}
@media (max-width:720px){.search-bar{grid-template-columns:1fr}}
.toggle{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--t2);white-space:nowrap}
.toggle input{width:18px;height:18px;accent-color:var(--a)}
.result-head{display:flex;justify-content:space-between;align-items:baseline;margin:16px 0 10px;color:var(--t3);font-size:13px}
.job-card{display:flex;flex-direction:column;gap:8px}
.job-card .top{display:flex;gap:12px;align-items:flex-start}
.job-card .job-img{flex-shrink:0;border-radius:8px}
.job-card a.name{font-size:16px;font-weight:600;color:var(--t1);text-decoration:none;line-height:1.35}
.job-card a.name:hover{text-decoration:underline}
.job-card .mdcl{font-size:12px;color:var(--t3)}
.job-card .sum{font-size:13px;color:var(--t2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.job-card .foot{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:space-between;margin-top:auto}
.recent{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.recent a{font-size:13px}
</style>
</head>
<body>
<div id="site-header"></div>
<main class="page">
  <div class="eyebrow">직무 탐색</div>
  <h1 class="page-h">어떤 일이 궁금해?</h1>
  <p class="page-sub">한국직업정보(KNOW)의 직무 <span id="total">537</span>개를 이름이나 평소 부르는 말로 찾아봐. 체험할 수 있는 직무는 바로 미션을 해볼 수 있어.</p>

  <form class="search-bar" id="search-form" role="search" onsubmit="return false">
    <label class="sr-only" for="q">직무 검색</label>
    <input class="input" id="q" name="q" type="search" placeholder="예: 마케터, 데이터, PD, 간호사" autocomplete="off">
    <label class="sr-only" for="field">분야</label>
    <select class="input" id="field" name="field"><option value="">전체 분야</option></select>
    <label class="toggle"><input type="checkbox" id="exp"> 체험 가능한 직무만</label>
  </form>
  <div class="recent" id="recent"></div>

  <div class="result-head"><span id="count" aria-live="polite"></span><span>체험 가능한 직무가 먼저 나와</span></div>
  <div id="results" class="grid grid-3"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>
  <div class="btn-row" style="justify-content:center;margin-top:16px"><button class="btn" id="more" hidden>더 보기</button></div>
</main>
<div id="site-footer"></div>
<script type="module" src="/jobs.js"></script>
</body>
</html>
